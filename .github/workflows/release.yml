name: Tri-OS Release Matrix
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test & Build
        run: |
          cargo test --all-targets
          cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nala-modelforge-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nala-modelforge-rs${{ matrix.ext }}
