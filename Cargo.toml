[package]
name = "nala-modelforge-rs"
version = "1.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["NALA Engineering (100% Native Safe Rust Tri-OS LLM Forge)"]
description = "100% Native Safe Rust Tri-OS LLM Precision Quantizer, MoE Expert Pruner (Bonsai 1-Bit / Gyro-Coder), Multi-User Asymmetric KV-Cache Planner, Norm-Preserving Abliteration Engine, LoRA Composer, NALA-RAG & NALA-Grid MCP Workstation"
readme = "README.md"
keywords = ["llm", "quantization", "moe", "gguf", "mlx", "abliteration", "rust", "mcp"]
categories = ["command-line-utilities", "science", "development-tools"]

[[bin]]
name = "nala-modelforge-rs"
path = "src/main.rs"

[dependencies]
# 100% Pure Safe Rust Standard Library (#![forbid(unsafe_code)]).
# Zero external crate supply-chain surface, instant 5-target cross-compilation:
# macOS ARM64/x86_64, Ubuntu/Linux x86_64/ARM64 (static musl), Windows x86_64.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
